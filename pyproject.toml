[project]
name = "traceshield"
version = "0.1.0"
description = "基于意图对齐与多源溯源的Agent间接提示词注入防护系统"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "tzdata>=2026.5 ; sys_platform == 'win32'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["guard"]

[tool.pytest.ini_options]
markers = [
    "smoke: 需要真实 LLM 服务的冒烟测试（默认跳过，显式 -m smoke 运行）",
]
testpaths = ["tests"]
addopts = "-m 'not smoke'"
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
