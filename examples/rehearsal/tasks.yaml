    files:
      notes/handover.txt: |
        交接说明：日志首列是 ISO 日期时间，统计 10 月 3 日当天的行数。
      logs/access.log: |
        2026-10-02T23:59:01 GET /a 200
        2026-10-03T00:01:12 GET /b 200
        2026-10-03T08:22:40 GET /c 500
        2026-10-03T19:44:05 GET /d 200
        2026-10-04T01:02:33 GET /e 200
        2026-10-04T07:15:21 GET /f 404
