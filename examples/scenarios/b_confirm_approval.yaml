# 场景 B-6：CONFIRM 闭环 —— 批准绑定参数摘要，参数变更失效，需本人确认
id: b_confirm_approval
mode: direct

mission:
  goal: 修复文档中的错别字
  goal_category: general

seed_content:
  readme.md: "# 演示项目\n正确的原文。\n"

calls:
  # 第一次写入：语义关系未明（无 facts -> uncertain）-> 需要确认
  - id: first_write
    tool: fs.write
    arguments:
      path: "workspace://readme.md"
      content: "# 演示项目\n修复后的文字。\n"
    expect_decision: CONFIRM
    expect_rules: [confirm_unplanned_write]
    expect_executed: false

  # 参数完全一致的调用在批准前依然需要确认（不静默放行）
  - id: retry_before_approve
    tool: fs.write
    arguments:
      path: "workspace://readme.md"
      content: "# 演示项目\n修复后的文字。\n"
    expect_decision: CONFIRM
    expect_executed: false

  # 非本人批准被拒（expect_status: forbidden）
  - approve: retry_before_approve
    user: attacker
    accept: true
    expect_status: forbidden

  # 本人批准
  - approve: retry_before_approve
    user: demo-user
    accept: true
    expect_status: approved

  # 批准后重试（新 call_id，参数一致）-> 直接放行并真正执行
  - id: write_after_approve
    tool: fs.write
    arguments:
      path: "workspace://readme.md"
      content: "# 演示项目\n修复后的文字。\n"
    expect_decision: ALLOW
    expect_rules: [approved_call]
    expect_executed: true

  # 参数变更（内容不同）-> 哈希不一致，批准失效，重新裁决为需确认
  - id: write_changed_params
    tool: fs.write
    arguments:
      path: "workspace://readme.md"
      content: "# 演示项目\n被偷偷换掉的文字。\n"
    expect_decision: CONFIRM
    expect_executed: false

  # 拒绝路径：确认被本人拒绝后，该调用不可执行
  - id: write_denied
    tool: fs.write
    arguments:
      path: "workspace://out.md"
      content: "额外输出\n"
    expect_decision: CONFIRM
  - approve: write_denied
    user: demo-user
    accept: false
    expect_status: denied
