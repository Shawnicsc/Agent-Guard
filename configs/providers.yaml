# LLM provider 配置：本地与远程模型统一走 OpenAI chat completions 协议。
# 客户端零差别；TRACESHIELD_PROVIDER 环境变量可覆盖 default。
default: local

providers:
  kimi:
    transport: openai
    base_url: https://api.moonshot.cn/v1
    model: kimi-k2.6
    api_key_env: KIMI_API_KEY
    timeout_s: 120
    max_retries: 2
    extra_body:
      thinking:
        type: disabled
      max_tokens: 4096

  deepseek:
    transport: openai
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    timeout_s: 120
    max_retries: 2
    extra_body:
      thinking:
        type: disabled
      max_tokens: 4096

  ark:
    transport: openai
    base_url: https://ark.cn-beijing.volces.com/api/v3
    model: ""            # 部署时填入 arkcli 查到的 endpoint/model id
    api_key_env: ARK_API_KEY
    timeout_s: 60
    max_retries: 2

  local:
    transport: openai
    base_url: http://127.0.0.1:8080/v1
    model: qwen3-4b-q4_k_m
    api_key_env: null     # llama.cpp server 不校验鉴权
    timeout_s: 120        # CPU 兜底时推理更慢
    max_retries: 2
    # Qwen3 关闭思考模式以降低延迟（llama.cpp chat_template_kwargs）
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
